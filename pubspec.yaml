name: safestep
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  http: ^1.2.1
  google_generative_ai: ^0.4.0
  flutter_animate: ^4.5.0
  lucide_icons_flutter: ^3.1.17
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  flutter_local_notifications: ^18.0.1
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  uuid: ^4.6.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/google_fonts/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/google_fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true



